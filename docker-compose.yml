version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: repomind-postgres
    restart: always
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repomind_x
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://repomind:password@db:5432/repomind_x
      - DEMO_MODE=true
      - AI_PROVIDER=nebius
      - AI_MODEL=nvidia/llama-3.1-nemotron-70b-instruct
      - NEBIUS_BASE_URL=https://api.studio.nebius.ai/v1
    depends_on:
      - db

volumes:
  postgres_data:
