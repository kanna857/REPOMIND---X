<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #0C101A;
      color: #dfe2f1;
      font-family: -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,240,255,0.2);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .badge {
      background: #141A28;
      color: #00FFA3;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      background: #00F0FF;
      color: #00363a;
      text-decoration: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="color: #00F0FF; font-size: 13px;">REPOMIND // X</strong>
    <span class="badge">SYS: ONLINE</span>
  </div>
  <p style="font-size: 12px; color: #a0aec0; margin: 0 0 10px 0;">
    NVIDIA Nemotron Copilot is active and monitoring open-source opportunities.
  </p>
  <div style="font-size: 11px; color: #718096;">
    Active Target: open-telemetry/python<br/>
    Match Rate: 96%
  </div>
  <a href="http://localhost:3000/dashboard" target="_blank" class="btn">OPEN FULL MISSION CONTROL</a>
</body>
</html>
